name: Build bad_apple

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: List built artifacts
        if: always()
        run: |
          Write-Host "=== target\x86_64-pc-windows-msvc\release ==="
          Get-ChildItem -Path target\x86_64-pc-windows-msvc\release -Force -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bad_apple-windows-x64
          path: target/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: error

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $exe = Get-ChildItem -Path target\x86_64-pc-windows-msvc\release -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "No executable found in target\x86_64-pc-windows-msvc\release"
            Get-ChildItem -Path target -Recurse -Force -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          Write-Host "Found executable: $($exe.FullName)"
          Compress-Archive -Path $exe.FullName, assets -DestinationPath bad_apple.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bad_apple.zip
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}