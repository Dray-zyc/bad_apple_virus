name: Build bad_apple_virus

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: List build artifacts
        if: always()
        run: |
          echo "=== target root ==="
          dir target
          echo "=== target\release ==="
          dir target\release || true
          echo "=== target\x86_64-pc-windows-msvc\release ==="
          dir target\x86_64-pc-windows-msvc\release || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bad_apple_virus-windows-x64
          path: target/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: error
